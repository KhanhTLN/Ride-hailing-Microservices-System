map $service $backend {
  default "";
  user user-service:8082;
  driver driver-service:8081;
  trip trip-service:8080;
  pricing pricing-service:8083;
}
server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  root /usr/share/nginx/html;
  index index.html;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options nosniff always;
  location = /health { access_log off; return 200 'ok'; }
  location ~ ^/backend/(?<service>user|driver|trip|pricing)(?<api_path>/.*)$ {
    proxy_pass http://$backend$api_path$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    add_header Cache-Control "no-store" always;
  }
  location /backend/ { return 404; }
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
