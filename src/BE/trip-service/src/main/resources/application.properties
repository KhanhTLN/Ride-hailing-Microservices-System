spring.application.name=trip-service
server.port=8080

# PostgreSQL Trip Database (Docker port 5434)
spring.datasource.url=${TRIP_DB_URL:jdbc:postgresql://localhost:5434/rhds_trip}
spring.datasource.username=${TRIP_DB_USERNAME:postgres}
spring.datasource.password=${TRIP_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Apache Kafka Configuration (KRaft broker on port 9092)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Internal gRPC Client Endpoints
pricing.grpc.host=${PRICING_GRPC_HOST:localhost}
pricing.grpc.port=${PRICING_GRPC_PORT:9093}
driver.grpc.host=${DRIVER_GRPC_HOST:localhost}
driver.grpc.port=${DRIVER_GRPC_PORT:9091}
