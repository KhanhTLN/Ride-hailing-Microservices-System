spring.application.name=pricing-service
server.port=8083

# gRPC Configuration
spring.grpc.server.port=9093

spring.datasource.url=${PRICING_DB_URL:jdbc:postgresql://localhost:5436/rhds_pricing}
spring.datasource.username=${PRICING_DB_USERNAME:postgres}
spring.datasource.password=${PRICING_DB_PASSWORD:pricing_local}

# Public providers are best-effort. Nominatim AND public OSRM allow at most 1 request/second.
maps.nominatim-base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
maps.photon-base-url=${PHOTON_BASE_URL:https://photon.komoot.io}
maps.osrm-base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
maps.motorbike-osrm-base-url=${OSRM_MOTORBIKE_BASE_URL:${OSRM_BASE_URL:https://router.project-osrm.org}}
maps.car-profile=${OSRM_CAR_PROFILE:driving}
maps.motorbike-profile=${OSRM_MOTORBIKE_PROFILE:driving}
maps.motorbike-uses-driving-model=${OSRM_MOTORBIKE_USES_DRIVING_MODEL:true}
maps.user-agent=${MAPS_USER_AGENT:RideHailingMicroservicesCourse/1.0}
maps.country-codes=${NOMINATIM_COUNTRY_CODES:vn}
maps.auth-base-url=${MAPS_AUTH_BASE_URL:http://localhost:8082}
maps.timeout-seconds=${MAPS_TIMEOUT_SECONDS:8}
maps.minimum-interval-ms=1100
maps.geocode-cache-seconds=604800
maps.route-cache-seconds=3600
