[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rhds-matching-service"
version = "0.1.0"
description = "Persistent Kafka/gRPC matching workflow for RHDS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
    "SQLAlchemy[asyncio]>=2.0.40,<2.1", "asyncpg>=0.30,<1",
    "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
    "aiokafka>=0.12,<1", "jsonschema[format]>=4.23,<5",
    "grpcio>=1.85.3,<2", "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "grpcio-tools==1.85.3", "ruff>=0.12,<1"]

[project.scripts]
matching-service = "matching_service.main:run"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
matching_service = ["resources/*.sql", "resources/schemas/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["src/ds03"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
