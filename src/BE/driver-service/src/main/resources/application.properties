spring.application.name=driver-service

server.port=8081

spring.datasource.url=${DRIVER_SERVICE_DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DRIVER_SERVICE_DB_USERNAME:postgres.hdhcnarqdxtouxtjurad}
spring.datasource.password=${DRIVER_SERVICE_DB_PASSWORD:PhamTheQuyen2005}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configurations for PostgreSQL
