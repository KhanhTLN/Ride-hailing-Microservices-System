spring.application.name=driver-service

server.port=8081

spring.datasource.url=${DRIVER_SERVICE_DB_URL}
spring.datasource.username=${DRIVER_SERVICE_DB_USERNAME}
spring.datasource.password=${DRIVER_SERVICE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configurations for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.auto_quote_keyword=true

# gRPC Client Configuration to User Service
spring.grpc.client.channels.user-service.address=${USER_GRPC_SERVER_ADDRESS:static://localhost:9090}
spring.grpc.server.port=${DRIVER_GRPC_PORT:${DRIVER_GRPC_SERVER_PORT:9091}}

driver.presence.redis.enabled=${DRIVER_REDIS_ENABLED:false}
spring.data.redis.url=${DRIVER_REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
