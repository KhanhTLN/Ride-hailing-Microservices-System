version: "3"

services: 
  api-gateway:
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "80:80"
    networks: 
      - microservices
  
  user-service:
    image: user-service:latest
    container_name: user-service
    ports:
      - "8081:8081"
    networks: 
      - microservices

  driver-service:
    image: driver-service:latest
    container_name: driver-service
    ports:
      - "8082:8082"
    networks: 
      - microservices

  trip-service:
    image: trip-service:latest
    container_name: trip-service
    ports:
      - "8083:8083"
    networks: 
      - microservices

  matching-service:
    image: matching-service:latest
    container_name: matching-service
    ports:
      - "8084:8084"
    networks: 
      - microservices

  payment-service:
    image: payment-service:latest
    container_name: payment-service
    ports:
      - "8085:8085"
    networks: 
      - microservices

networks: 
  microservices: