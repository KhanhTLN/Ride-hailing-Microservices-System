events {}

http {
    upstream user_service {
        server user-service:8081;
    }   

    upstream driver_service {
        server driver-service:8082;
    }

    upstream trip_service {
        server trip-service:8083;
    }

    upstream matching_service {
        server matching-service:8084;
    }

    upstream payment_service {
        server payment-service:8085;
    }

    server {
        listen 80; 
        server_name ridehailing.com www.ridehailing.com;

        location /api/users/ {
            proxy_pass http://user_service/; 

            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/drivers/ {
            proxy_pass http://driver_service/; 

            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/trips/ {
            proxy_pass http://trip_service/; 

            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/matching/ {
            proxy_pass http://matching_service/; 

            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/payments/ {
            proxy_pass http://payment_service/; 

            proxy_set_header Host $host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}