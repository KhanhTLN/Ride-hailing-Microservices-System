# Local development stack. Run from the repository root:
# docker compose -f deploy/docker-compose.yml up -d --build
name: rhds-local

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

x-java-health: &java-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

x-matching: &matching
  image: rhds-local/matching-service:dev
  build:
    context: ..
    dockerfile: src/BE/matching-service/Dockerfile
  environment: &matching-env
    DATABASE_URL: postgresql+psycopg://matching:${MATCHING_DB_PASSWORD:-matching_local}@matching-db:5432/matching_db
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    TRIP_TOPIC: ds03.trip.events.v1
    MATCHING_TOPIC: ds03.matching.events.v1
    CONSUMER_GROUP: matching-v1
    DRIVER_GRPC_TARGET: driver-service:9091
    # The current plaintext gRPC server requires Matching's local/demo mode.
    # Authentication still uses the RS256 service token below.
    DEMO_MODE: "true"
    DRIVER_TLS: "false"
    MATCHING_DRIVER_TOKEN_FILE: /run/service-token/token
    HEALTH_HOST: 0.0.0.0
    HEALTH_PORT: "8084"

services:
  frontend:
    build:
      context: ../src/FE
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FE_HTTP_PORT:-5173}:80"
    depends_on:
      user-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy

  user-db:
    <<: *postgres
    environment:
      POSTGRES_DB: rhds_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_local}
    ports:
      - "127.0.0.1:${USER_DB_PORT:-5435}:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    # User Service currently creates/updates its schema through Hibernate.
    # The legacy userdb_init.sql has incompatible role constraints.

  pricing-db:
    <<: *postgres
    environment:
      POSTGRES_DB: rhds_pricing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRICING_DB_PASSWORD:-pricing_local}
    ports:
      - "127.0.0.1:${PRICING_DB_PORT:-5436}:5432"
    volumes:
      - pricing_data:/var/lib/postgresql/data
      - ./sql/pricing.sql:/docker-entrypoint-initdb.d/01-pricing.sql:ro

  driver-db:
    <<: *postgres
    environment:
      POSTGRES_DB: rhds_driver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DRIVER_DB_PASSWORD:-driver_local}
    ports:
      - "127.0.0.1:${DRIVER_DB_PORT:-5433}:5432"
    volumes:
      - driver_data:/var/lib/postgresql/data
      - ../scripts/sql/driver/schema.sql:/docker-entrypoint-initdb.d/01-driver.sql:ro

  trip-db:
    <<: *postgres
    environment:
      POSTGRES_DB: rhds_trip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TRIP_DB_PASSWORD:-trip_local}
    ports:
      - "127.0.0.1:${TRIP_DB_PORT:-5434}:5432"
    volumes:
      - trip_data:/var/lib/postgresql/data
      - ../scripts/sql/tripdb_init.sql:/docker-entrypoint-initdb.d/01-trip.sql:ro

  matching-db:
    <<: *postgres
    environment:
      POSTGRES_DB: matching_db
      POSTGRES_USER: matching
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD:-matching_local}
    ports:
      - "127.0.0.1:${MATCHING_DB_PORT:-5544}:5432"
    volumes:
      - matching_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-volume-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    restart: "no"
    entrypoint: [/bin/sh, -ec]
    command: ["chown -R 1000:1000 /kafka-data"]
    volumes:
      - kafka_data:/kafka-data

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:29092, --list]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in \
          ds03.trip.events.v1 \
          ds03.matching.events.v1 \
          ds03.payment.commands.v1 \
          ds03.payment.events.v1 \
          ds03.trip.events.v1.dlq.matching-v1 \
          ds03.trip.events.v1.dlq.notification-v1 \
          ds03.matching.events.v1.dlq.trip-matching-v1 \
          ds03.payment.commands.v1.dlq.payment-v1 \
          ds03.payment.events.v1.dlq.trip-payment-v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000
        done

  # Local fixture: supplies the exact RS256 claims DriverGrpcSecurity checks.
  # User Service currently only issues HMAC user access/refresh tokens.
  local-service-tokens:
    build:
      context: ./local-auth
    restart: unless-stopped
    volumes:
      - service_signing_key:/keys
      - driver_auth:/auth/driver
      - matching_token:/auth/matching
      - trip_token:/auth/trip
    healthcheck:
      test: [CMD, python, /app/service_tokens.py, --check]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  user-schema-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${USER_DB_PASSWORD:-user_local}
    command: [psql, -h, user-db, -U, postgres, -d, rhds_user, -v, ON_ERROR_STOP=1, -f, /migration.sql]
    volumes:
      - ./sql/user-v2.sql:/migration.sql:ro
    depends_on:
      user-db:
        condition: service_healthy

  user-service:
    build:
      context: ../src/BE
      dockerfile: user-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8082"
      SPRING_GRPC_SERVER_PORT: "9090"
      USER_SERVICE_DB_URL: jdbc:postgresql://user-db:5432/rhds_user
      USER_SERVICE_DB_USERNAME: postgres
      USER_SERVICE_DB_PASSWORD: ${USER_DB_PASSWORD:-user_local}
      JWT_SECRET: ${JWT_SECRET:-local-development-shared-jwt-secret-change-me-0123456789-abcdefghij}
      JWT_ACCESSTOKEN_EXPIRATION: "900000"
      JWT_REFRESHTOKEN_EXPIRATION: "604800000"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
    ports:
      - "127.0.0.1:${USER_HTTP_PORT:-8082}:8082"
      - "127.0.0.1:${USER_GRPC_PORT:-9090}:9090"
    depends_on:
      user-schema-init:
        condition: service_completed_successfully
      user-db:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8082/internal/identity/health/ready]

  driver-service:
    build:
      context: ../src/BE
      dockerfile: driver-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      DRIVER_GRPC_PORT: "9091"
      DRIVER_SERVICE_DB_URL: jdbc:postgresql://driver-db:5432/rhds_driver
      DRIVER_SERVICE_DB_USERNAME: postgres
      DRIVER_SERVICE_DB_PASSWORD: ${DRIVER_DB_PASSWORD:-driver_local}
      HIBERNATE_DDL_AUTO: validate
      USER_GRPC_SERVER_ADDRESS: static://user-service:9090
      JWT_SECRET: ${JWT_SECRET:-local-development-shared-jwt-secret-change-me-0123456789-abcdefghij}
      DRIVER_REDIS_ENABLED: "true"
      DRIVER_REDIS_URL: redis://redis:6379
      SPRING_CONFIG_IMPORT: configtree:/run/driver-auth/
    ports:
      - "127.0.0.1:${DRIVER_HTTP_PORT:-8081}:8081"
      - "127.0.0.1:${DRIVER_GRPC_PORT:-9091}:9091"
    volumes:
      - driver_auth:/run/driver-auth:ro
    depends_on:
      driver-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      local-service-tokens:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/internal/driver/health/ready]

  pricing-schema-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${PRICING_DB_PASSWORD:-pricing_local}
    command: [psql, -h, pricing-db, -U, postgres, -d, rhds_pricing, -v, ON_ERROR_STOP=1, -f, /migration.sql]
    volumes:
      - ./sql/pricing.sql:/migration.sql:ro
    depends_on:
      pricing-db:
        condition: service_healthy

  pricing-service:
    build:
      context: ../src/BE
      dockerfile: pricing-service/Dockerfile
    restart: unless-stopped
    environment:
      PRICING_DB_URL: jdbc:postgresql://pricing-db:5432/rhds_pricing
      PRICING_DB_USERNAME: postgres
      PRICING_DB_PASSWORD: ${PRICING_DB_PASSWORD:-pricing_local}
      JWT_SECRET: ${JWT_SECRET:-local-development-shared-jwt-secret-change-me-0123456789-abcdefghij}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      PHOTON_BASE_URL: ${PHOTON_BASE_URL:-https://photon.komoot.io}
      NOMINATIM_COUNTRY_CODES: ${NOMINATIM_COUNTRY_CODES-vn}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      OSRM_MOTORBIKE_BASE_URL: ${OSRM_MOTORBIKE_BASE_URL:-https://router.project-osrm.org}
      OSRM_CAR_PROFILE: ${OSRM_CAR_PROFILE:-driving}
      OSRM_MOTORBIKE_PROFILE: ${OSRM_MOTORBIKE_PROFILE:-driving}
      OSRM_MOTORBIKE_USES_DRIVING_MODEL: ${OSRM_MOTORBIKE_USES_DRIVING_MODEL:-true}
      MAPS_USER_AGENT: ${MAPS_USER_AGENT:-RideHailingMicroservicesCourse/1.0}
      MAPS_AUTH_BASE_URL: ${MAPS_AUTH_BASE_URL:-http://localhost:${USER_HTTP_PORT:-8082}}
      SERVER_PORT: "8083"
      SPRING_GRPC_SERVER_PORT: "9093"
    ports:
      - "127.0.0.1:${PRICING_HTTP_PORT:-8083}:8083"
      - "127.0.0.1:${PRICING_GRPC_PORT:-9093}:9093"
    depends_on:
      pricing-schema-init:
        condition: service_completed_successfully
      pricing-db:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8083/internal/pricing/health/ready]

  matching-init:
    <<: *matching
    restart: "no"
    command: [python, -m, matching, init-db]
    depends_on:
      matching-db:
        condition: service_healthy

  matching-service:
    <<: *matching
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MATCHING_HTTP_PORT:-8084}:8084"
    volumes:
      - matching_token:/run/service-token:ro
    stop_grace_period: 30s
    depends_on:
      matching-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      driver-service:
        condition: service_healthy
    healthcheck:
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/internal/matching/health/ready', timeout=6).close()"

  trip-schema-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${TRIP_DB_PASSWORD:-trip_local}
    command: [psql, -h, trip-db, -U, postgres, -d, rhds_trip, -v, ON_ERROR_STOP=1, -f, /migration.sql]
    volumes:
      - ./sql/trip-v2.sql:/migration.sql:ro
    depends_on:
      trip-db:
        condition: service_healthy

  trip-service:
    build:
      context: ../src/BE
      dockerfile: trip-service/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-development-shared-jwt-secret-change-me-0123456789-abcdefghij}
      SERVER_PORT: "8080"
      TRIP_DB_URL: jdbc:postgresql://trip-db:5432/rhds_trip
      TRIP_DB_USERNAME: postgres
      TRIP_DB_PASSWORD: ${TRIP_DB_PASSWORD:-trip_local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRICING_GRPC_HOST: pricing-service
      PRICING_GRPC_PORT: "9093"
      DRIVER_GRPC_HOST: driver-service
      DRIVER_GRPC_PORT: "9091"
      TRIP_DRIVER_TLS: "false"
      TRIP_DRIVER_TOKEN_FILE: /run/service-token/token
    ports:
      - "127.0.0.1:${TRIP_HTTP_PORT:-8080}:8080"
    volumes:
      - trip_token:/run/service-token:ro
    depends_on:
      trip-schema-init:
        condition: service_completed_successfully
      trip-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      driver-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
    healthcheck:
      <<: *java-health
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/internal/trip/health/ready]

volumes:
  pricing_data:
  user_data:
  driver_data:
  trip_data:
  matching_data:
  redis_data:
  kafka_data:
  service_signing_key:
  driver_auth:
  matching_token:
  trip_token:
