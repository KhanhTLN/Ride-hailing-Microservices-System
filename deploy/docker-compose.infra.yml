version: '3.8'

services:
  # =========================================================================
  # 1. POSTGRESQL CHO TRIP SERVICE
  # Cổng máy host: 5434 (để tránh xung đột với cổng 5432)
  # =========================================================================
  rhds-trip-db:
    image: postgres:16-alpine
    container_name: rhds-trip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rhds_trip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - trip_postgres_data:/var/lib/postgresql/data
      - ../scripts/sql/tripdb_init.sql:/docker-entrypoint-initdb.d/01-tripdb_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rhds_trip"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. APACHE KAFKA (CHẾ ĐỘ KRAFT - KHÔNG DÙNG ZOOKEEPER)
  # Cổng máy host: 9092
  # =========================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: rhds-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # =========================================================================
  # 3. JOB TỰ ĐỘNG TẠO 9 TOPICS KAFKA (4 TOPICS CHÍNH + 5 DLQ)
  # =========================================================================
  kafka-init-topics:
    image: apache/kafka:3.8.0
    container_name: rhds-kafka-init-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      
      # 1. Bốn Topics nghiệp vụ chính
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ds03.trip.events.v1 --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ds03.matching.events.v1 --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ds03.payment.commands.v1 --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ds03.payment.events.v1 --partitions 1 --replication-factor 1

      # 2. Năm Topics Dead-Letter Queue (DLQ)
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ds03.trip.events.v1.dlq.matching-v1 --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ds03.trip.events.v1.dlq.notification-v1 --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ds03.matching.events.v1.dlq.trip-matching-v1 --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ds03.payment.commands.v1.dlq.payment-v1 --partitions 1 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic ds03.payment.events.v1.dlq.trip-payment-v1 --partitions 1 --replication-factor 1

      echo 'All 9 topics created successfully! List of topics:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "

  # =========================================================================
  # 4. KAFKA UI - GIAO DIỆN TRỰC QUAN QUẢN LÝ KAFKA TRÊN TRÌNH DUYỆT
  # Cổng máy host: 8085 (Truy cập: http://localhost:8085)
  # =========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rhds-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rhds-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  trip_postgres_data:
    name: rhds_trip_postgres_data
  kafka_data:
    name: rhds_kafka_data
