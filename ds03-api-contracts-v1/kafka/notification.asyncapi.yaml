asyncapi: 3.0.0
info:
  title: notification Kafka contract
  version: 1.0.0
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Development example; production uses authenticated TLS listeners
channels:
  ds03_trip_events_v1:
    address: ds03.trip.events.v1
    messages:
      DriverOffered:
        $ref: '#/components/messages/DriverOffered'
      TripAccepted:
        $ref: '#/components/messages/TripAccepted'
      DriverArrived:
        $ref: '#/components/messages/DriverArrived'
      TripStarted:
        $ref: '#/components/messages/TripStarted'
      TripCompleted:
        $ref: '#/components/messages/TripCompleted'
      TripCancelled:
        $ref: '#/components/messages/TripCancelled'
      TripUnmatched:
        $ref: '#/components/messages/TripUnmatched'
      TripPaymentUpdated:
        $ref: '#/components/messages/TripPaymentUpdated'
operations:
  receiveDriverOffered:
    action: receive
    channel:
      $ref: '#/channels/ds03_trip_events_v1'
    messages:
    - $ref: '#/channels/ds03_trip_events_v1/messages/DriverOffered'
  receiveTripAccepted:
    action: receive
    channel:
      $ref: '#/channels/ds03_trip_events_v1'
    messages:
    - $ref: '#/channels/ds03_trip_events_v1/messages/TripAccepted'
  receiveDriverArrived:
    action: receive
    channel:
      $ref: '#/channels/ds03_trip_events_v1'
    messages:
    - $ref: '#/channels/ds03_trip_events_v1/messages/DriverArrived'
  receiveTripStarted:
    action: receive
    channel:
      $ref: '#/channels/ds03_trip_events_v1'
    messages:
    - $ref: '#/channels/ds03_trip_events_v1/messages/TripStarted'
  receiveTripCompleted:
    action: receive
    channel:
      $ref: '#/channels/ds03_trip_events_v1'
    messages:
    - $ref: '#/channels/ds03_trip_events_v1/messages/TripCompleted'
  receiveTripCancelled:
    action: receive
    channel:
      $ref: '#/channels/ds03_trip_events_v1'
    messages:
    - $ref: '#/channels/ds03_trip_events_v1/messages/TripCancelled'
  receiveTripUnmatched:
    action: receive
    channel:
      $ref: '#/channels/ds03_trip_events_v1'
    messages:
    - $ref: '#/channels/ds03_trip_events_v1/messages/TripUnmatched'
  receiveTripPaymentUpdated:
    action: receive
    channel:
      $ref: '#/channels/ds03_trip_events_v1'
    messages:
    - $ref: '#/channels/ds03_trip_events_v1/messages/TripPaymentUpdated'
components:
  messages:
    DriverOffered:
      name: DriverOffered
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          title: DriverOffered
          type: object
          properties:
            event_id:
              type: string
              format: uuid
            event_type:
              const: DriverOffered
            schema_version:
              const: 1
            producer:
              const: trip
            occurred_at:
              type: string
              format: date-time
            correlation_id:
              type: string
              format: uuid
            causation_id:
              type: string
              format: uuid
            aggregate_id:
              type: string
              format: uuid
            aggregate_version:
              type: integer
              minimum: 1
              maximum: 2147483647
            data:
              type: object
              properties:
                trip_id:
                  type: string
                  format: uuid
                passenger_id:
                  type: string
                  format: uuid
                driver_id:
                  type: string
                  format: uuid
                driver_user_id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum:
                  - SEARCHING
                  - DRIVER_OFFERED
                  - ACCEPTED
                  - ARRIVED
                  - IN_PROGRESS
                  - COMPLETED
                  - CANCELLED
                  - NO_DRIVER
                trip_version:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                attempt_id:
                  type: string
                  format: uuid
                reservation_id:
                  type: string
                  format: uuid
                expires_at:
                  type: string
                  format: date-time
                pickup:
                  type: object
                  properties:
                    latitude:
                      type: number
                      minimum: -90
                      maximum: 90
                    longitude:
                      type: number
                      minimum: -180
                      maximum: 180
                    address:
                      type: string
                      maxLength: 300
                  required:
                  - latitude
                  - longitude
                  additionalProperties: false
                dropoff:
                  type: object
                  properties:
                    latitude:
                      type: number
                      minimum: -90
                      maximum: 90
                    longitude:
                      type: number
                      minimum: -180
                      maximum: 180
                    address:
                      type: string
                      maxLength: 300
                  required:
                  - latitude
                  - longitude
                  additionalProperties: false
                estimated_fare:
                  type: object
                  properties:
                    amount:
                      type: string
                      pattern: ^(0|[1-9][0-9]*)$
                    currency:
                      type: string
                      enum:
                      - VND
                  required:
                  - amount
                  - currency
                  additionalProperties: false
              required:
              - trip_id
              - passenger_id
              - driver_id
              - driver_user_id
              - status
              - trip_version
              - attempt_id
              - reservation_id
              - expires_at
              - pickup
              - dropoff
              - estimated_fare
              additionalProperties: false
          required:
          - event_id
          - event_type
          - schema_version
          - producer
          - occurred_at
          - correlation_id
          - causation_id
          - aggregate_id
          - aggregate_version
          - data
          additionalProperties: false
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: trip_id; stable within a trip
          bindingVersion: 0.5.0
