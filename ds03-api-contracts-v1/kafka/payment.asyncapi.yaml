asyncapi: 3.0.0
info:
  title: payment Kafka contract
  version: 1.0.0
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Development example; production uses authenticated TLS listeners
channels:
  ds03_payment_commands_v1:
    address: ds03.payment.commands.v1
    messages:
      PaymentRequested:
        $ref: '#/components/messages/PaymentRequested'
  ds03_payment_events_v1:
    address: ds03.payment.events.v1
    messages:
      PaymentSucceeded:
        $ref: '#/components/messages/PaymentSucceeded'
      PaymentFailed:
        $ref: '#/components/messages/PaymentFailed'
operations:
  receivePaymentRequested:
    action: receive
    channel:
      $ref: '#/channels/ds03_payment_commands_v1'
    messages:
    - $ref: '#/channels/ds03_payment_commands_v1/messages/PaymentRequested'
  sendPaymentSucceeded:
    action: send
    channel:
      $ref: '#/channels/ds03_payment_events_v1'
    messages:
    - $ref: '#/channels/ds03_payment_events_v1/messages/PaymentSucceeded'
  sendPaymentFailed:
    action: send
    channel:
      $ref: '#/channels/ds03_payment_events_v1'
    messages:
    - $ref: '#/channels/ds03_payment_events_v1/messages/PaymentFailed'
components:
  messages:
    PaymentRequested:
      name: PaymentRequested
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          title: PaymentRequested
          type: object
          properties:
            event_id:
              type: string
              format: uuid
            event_type:
              const: PaymentRequested
            schema_version:
              const: 1
            producer:
              const: trip
            occurred_at:
              type: string
              format: date-time
            correlation_id:
              type: string
              format: uuid
            causation_id:
              type: string
              format: uuid
            aggregate_id:
              type: string
              format: uuid
            aggregate_version:
              type: integer
              minimum: 1
              maximum: 2147483647
            data:
              type: object
              properties:
                trip_id:
                  type: string
                  format: uuid
                passenger_id:
                  type: string
                  format: uuid
                payment_id:
                  type: string
                  format: uuid
                attempt_number:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                amount:
                  type: object
                  properties:
                    amount:
                      type: string
                      pattern: ^(0|[1-9][0-9]*)$
                    currency:
                      type: string
                      enum:
                      - VND
                  required:
                  - amount
                  - currency
                  additionalProperties: false
                method:
                  type: string
                  enum:
                  - SIMULATED
              required:
              - trip_id
              - passenger_id
              - payment_id
              - attempt_number
              - amount
              - method
              additionalProperties: false
          required:
          - event_id
          - event_type
          - schema_version
          - producer
          - occurred_at
          - correlation_id
          - causation_id
          - aggregate_id
          - aggregate_version
          - data
          additionalProperties: false
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: trip_id; stable within a trip
          bindingVersion: 0.5.0
    PaymentSucceeded:
      name: PaymentSucceeded
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          title: PaymentSucceeded
          type: object
          properties:
            event_id:
              type: string
              format: uuid
            event_type:
              const: PaymentSucceeded
            schema_version:
              const: 1
            producer:
              const: payment
            occurred_at:
              type: string
              format: date-time
            correlation_id:
              type: string
              format: uuid
            causation_id:
              type: string
              format: uuid
            aggregate_id:
              type: string
              format: uuid
            aggregate_version:
              type: integer
              minimum: 1
              maximum: 2147483647
            data:
              type: object
              properties:
                trip_id:
                  type: string
                  format: uuid
                passenger_id:
                  type: string
                  format: uuid
                payment_id:
                  type: string
                  format: uuid
                attempt_number:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                amount:
                  type: object
                  properties:
                    amount:
                      type: string
                      pattern: ^(0|[1-9][0-9]*)$
                    currency:
                      type: string
                      enum:
                      - VND
                  required:
                  - amount
                  - currency
                  additionalProperties: false
              required:
              - trip_id
              - passenger_id
              - payment_id
              - attempt_number
              - amount
              additionalProperties: false
          required:
          - event_id
          - event_type
          - schema_version
          - producer
          - occurred_at
          - correlation_id
          - causation_id
          - aggregate_id
          - aggregate_version
          - data
          additionalProperties: false
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: trip_id; stable within a trip
          bindingVersion: 0.5.0
    PaymentFailed:
      name: PaymentFailed
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          $schema: http://json-schema.org/draft-07/schema#
          title: PaymentFailed
          type: object
          properties:
            event_id:
              type: string
              format: uuid
            event_type:
              const: PaymentFailed
            schema_version:
              const: 1
            producer:
              const: payment
            occurred_at:
              type: string
              format: date-time
            correlation_id:
              type: string
              format: uuid
            causation_id:
              type: string
              format: uuid
            aggregate_id:
              type: string
              format: uuid
            aggregate_version:
              type: integer
              minimum: 1
              maximum: 2147483647
            data:
              type: object
              properties:
                trip_id:
                  type: string
                  format: uuid
                passenger_id:
                  type: string
                  format: uuid
                payment_id:
                  type: string
                  format: uuid
                attempt_number:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                amount:
                  type: object
                  properties:
                    amount:
                      type: string
                      pattern: ^(0|[1-9][0-9]*)$
                    currency:
                      type: string
                      enum:
                      - VND
                  required:
                  - amount
                  - currency
                  additionalProperties: false
                failure_code:
                  type: string
                  enum:
                  - SIMULATED_DECLINE
                  - PROCESSING_ERROR
              required:
              - trip_id
              - passenger_id
              - payment_id
              - attempt_number
              - amount
              - failure_code
              additionalProperties: false
          required:
          - event_id
          - event_type
          - schema_version
          - producer
          - occurred_at
          - correlation_id
          - causation_id
          - aggregate_id
          - aggregate_version
          - data
          additionalProperties: false
      bindings:
        kafka:
          key:
            type: string
            format: uuid
            description: trip_id; stable within a trip
          bindingVersion: 0.5.0
