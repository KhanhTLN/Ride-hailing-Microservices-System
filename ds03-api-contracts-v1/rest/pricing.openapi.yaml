openapi: 3.1.0
info:
  title: pricing REST Contract
  version: 1.0.0
  description: Proposed team baseline. Seven independently deployed services; x-owner-service
    identifies the owner. Gateway routing is optional. See docs/CONTRACT.md for normative
    business rules.
servers:
- url: http://localhost:8080
  description: Local gateway example; configure service routing
security:
- bearerAuth: []
paths:
  /api/v1/quotes:
    post:
      operationId: createQuote
      tags:
      - pricing
      summary: createQuote
      x-owner-service: pricing
      x-roles:
      - PASSENGER
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema: &id001
          type: string
          format: uuid
        description: Generated by ingress if absent; propagated end to end.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Same key and canonical payload for retries; persist >= 7 days.
      responses:
        '201':
          description: Success
          headers:
            X-Correlation-ID:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Deadline exceeded; outcome may be unknown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteInput'
  /internal/pricing/health/live:
    get:
      operationId: pricingLiveness
      tags:
      - pricing
      summary: Local/private deployment endpoint; not routed to public gateway
      x-owner-service: pricing
      x-roles: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema: *id001
        description: Generated by ingress if absent; propagated end to end.
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-ID:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Deadline exceeded; outcome may be unknown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /internal/pricing/health/ready:
    get:
      operationId: pricingReadiness
      tags:
      - pricing
      summary: 200 ready; 503 not ready; local/private endpoint
      x-owner-service: pricing
      x-roles: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema: *id001
        description: Generated by ingress if absent; propagated end to end.
      responses:
        '200':
          description: Success
          headers:
            X-Correlation-ID:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Deadline exceeded; outcome may be unknown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Point:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        address:
          type: string
          maxLength: 300
      required:
      - latitude
      - longitude
      additionalProperties: false
    Money:
      type: object
      properties:
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)$
        currency:
          type: string
          enum:
          - VND
      required:
      - amount
      - currency
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        correlation_id: *id001
        retryable: &id002
          type: boolean
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - correlation_id
      - retryable
      - details
      additionalProperties: false
    User:
      type: object
      properties:
        id: *id001
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 100
        roles:
          type: array
          items:
            type: string
            enum:
            - PASSENGER
            - DRIVER
            - ADMIN
        created_at: &id003
          type: string
          format: date-time
      required:
      - id
      - email
      - display_name
      - roles
      - created_at
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
          - PASSENGER
          - DRIVER
      required:
      - email
      - password
      - display_name
      - role
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 128
      required:
      - email
      - password
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - refresh_token
      additionalProperties: false
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 2147483647
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
      additionalProperties: false
    ServiceTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        client_id:
          type: string
        client_secret:
          type: string
        audience:
          type: string
        scope:
          type: string
      required:
      - grant_type
      - client_id
      - client_secret
      - audience
      - scope
      additionalProperties: false
    ServiceToken:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
          maximum: 2147483647
        scope:
          type: string
      required:
      - access_token
      - token_type
      - expires_in
      - scope
      additionalProperties: false
    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
                enum:
                - RSA
              kid:
                type: string
              use:
                type: string
                enum:
                - sig
              alg:
                type: string
                enum:
                - RS256
              n:
                type: string
              e:
                type: string
            required:
            - kty
            - kid
            - use
            - alg
            - n
            - e
            additionalProperties: false
      required:
      - keys
    Driver:
      type: object
      properties:
        id: *id001
        user_id: *id001
        license_number:
          type: string
        account_status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - SUSPENDED
        accepting_trips: *id002
        created_at: *id003
      required:
      - id
      - user_id
      - license_number
      - account_status
      - accepting_trips
      - created_at
      additionalProperties: false
    DriverCreate:
      type: object
      properties:
        license_number:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - license_number
      additionalProperties: false
    Approval:
      type: object
      properties:
        account_status:
          type: string
          enum:
          - APPROVED
          - SUSPENDED
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - account_status
      - reason
      additionalProperties: false
    VehicleInput:
      type: object
      properties:
        plate_number: &id004
          type: string
          minLength: 1
          maxLength: 20
        vehicle_type: &id005
          type: string
          enum:
          - MOTORBIKE
          - CAR
        brand: &id006
          type: string
          maxLength: 80
        model: &id007
          type: string
          maxLength: 80
        color: &id008
          type: string
          maxLength: 40
        seat_count: &id009
          type: integer
          minimum: 1
          maximum: 16
      required:
      - plate_number
      - vehicle_type
      - brand
      - model
      - color
      - seat_count
      additionalProperties: false
    Vehicle:
      type: object
      properties:
        plate_number: *id004
        vehicle_type: *id005
        brand: *id006
        model: *id007
        color: *id008
        seat_count: *id009
        id: *id001
        driver_id: *id001
        is_active: *id002
      required:
      - plate_number
      - vehicle_type
      - brand
      - model
      - color
      - seat_count
      - id
      - driver_id
      - is_active
      additionalProperties: false
    AvailabilityInput:
      type: object
      properties:
        accepting_trips: *id002
      required:
      - accepting_trips
      additionalProperties: false
    Availability:
      type: object
      properties:
        accepting_trips: *id002
        last_seen_at: *id003
      required:
      - accepting_trips
      - last_seen_at
      additionalProperties: false
    LocationSession:
      type: object
      properties:
        session_id: *id001
        started_at: *id003
      required:
      - session_id
      - started_at
      additionalProperties: false
    LocationInput:
      type: object
      properties:
        session_id: *id001
        sequence_number: &id010
          type: integer
          minimum: 0
          maximum: 9007199254740991
        point: &id011
          $ref: '#/components/schemas/Point'
        recorded_at: *id003
      required:
      - session_id
      - sequence_number
      - point
      - recorded_at
      additionalProperties: false
    Location:
      type: object
      properties:
        session_id: *id001
        sequence_number: *id010
        point: *id011
        recorded_at: *id003
        driver_id: *id001
        received_at: *id003
      required:
      - session_id
      - sequence_number
      - point
      - recorded_at
      - driver_id
      - received_at
      additionalProperties: false
    Heartbeat:
      type: object
      properties:
        session_id: *id001
      required:
      - session_id
      additionalProperties: false
    Ack:
      type: object
      properties:
        accepted: *id002
        server_time: *id003
      required:
      - accepted
      - server_time
      additionalProperties: false
    QuoteInput:
      type: object
      properties:
        pickup:
          $ref: '#/components/schemas/Point'
        dropoff:
          $ref: '#/components/schemas/Point'
        vehicle_type:
          type: string
          enum:
          - MOTORBIKE
          - CAR
      required:
      - pickup
      - dropoff
      - vehicle_type
      additionalProperties: false
    Quote:
      type: object
      properties:
        id: *id001
        passenger_id: *id001
        pickup:
          $ref: '#/components/schemas/Point'
        dropoff:
          $ref: '#/components/schemas/Point'
        vehicle_type:
          type: string
          enum:
          - MOTORBIKE
          - CAR
        estimated_distance_m:
          type: integer
          minimum: 0
          maximum: 2147483647
        estimated_duration_s:
          type: integer
          minimum: 0
          maximum: 2147483647
        fare:
          $ref: '#/components/schemas/Money'
        pricing_version:
          type: string
        expires_at: *id003
      required:
      - id
      - passenger_id
      - pickup
      - dropoff
      - vehicle_type
      - estimated_distance_m
      - estimated_duration_s
      - fare
      - pricing_version
      - expires_at
      additionalProperties: false
    Trip:
      type: object
      properties:
        id: *id001
        passenger_id: *id001
        status:
          type: string
          enum:
          - SEARCHING
          - DRIVER_OFFERED
          - ACCEPTED
          - ARRIVED
          - IN_PROGRESS
          - COMPLETED
          - CANCELLED
          - NO_DRIVER
        payment_status:
          type: string
          enum:
          - NOT_REQUESTED
          - PENDING
          - SUCCEEDED
          - FAILED
        quote_id: *id001
        pickup:
          $ref: '#/components/schemas/Point'
        dropoff:
          $ref: '#/components/schemas/Point'
        vehicle_type:
          type: string
          enum:
          - MOTORBIKE
          - CAR
        estimated_fare:
          $ref: '#/components/schemas/Money'
        final_fare:
          $ref: '#/components/schemas/Money'
        driver_id: *id001
        reservation_id: *id001
        attempt_id: *id001
        version:
          type: integer
          minimum: 1
          maximum: 2147483647
        created_at: *id003
        updated_at: *id003
        accepted_at: *id003
        started_at: *id003
        completed_at: *id003
        cancelled_at: *id003
      required:
      - id
      - passenger_id
      - status
      - payment_status
      - quote_id
      - pickup
      - dropoff
      - vehicle_type
      - estimated_fare
      - version
      - created_at
      - updated_at
      additionalProperties: false
    TripCreate:
      type: object
      properties:
        quote_id: *id001
        payment_method:
          type: string
          enum:
          - SIMULATED
      required:
      - quote_id
      - payment_method
      additionalProperties: false
    TripAction:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - expected_version
      additionalProperties: false
    TripReasonAction:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - expected_version
      - reason
      additionalProperties: false
    TripOfferAction:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
          maximum: 2147483647
        attempt_id: *id001
        reservation_id: *id001
      required:
      - expected_version
      - attempt_id
      - reservation_id
      additionalProperties: false
    Operation:
      type: object
      properties:
        id: *id001
        trip_id: *id001
        type:
          type: string
          enum:
          - ACCEPT
          - REJECT
          - CANCEL
          - COMPLETE
          - PAYMENT_RETRY
        status:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
        error_code:
          type: string
        created_at: *id003
        updated_at: *id003
      required:
      - id
      - trip_id
      - type
      - status
      - created_at
      - updated_at
      additionalProperties: false
    Payment:
      type: object
      properties:
        id: *id001
        trip_id: *id001
        passenger_id: *id001
        amount:
          $ref: '#/components/schemas/Money'
        method:
          type: string
          enum:
          - SIMULATED
        status:
          type: string
          enum:
          - PENDING
          - SUCCEEDED
          - FAILED
        attempt_number:
          type: integer
          minimum: 1
          maximum: 2147483647
        failure_code:
          type: string
        updated_at: *id003
      required:
      - id
      - trip_id
      - passenger_id
      - amount
      - method
      - status
      - attempt_number
      - updated_at
      additionalProperties: false
    Notification:
      type: object
      properties:
        id: *id001
        user_id: *id001
        source_event_id: *id001
        trip_id: *id001
        type:
          type: string
        title:
          type: string
        body:
          type: string
        read: *id002
        created_at: *id003
      required:
      - id
      - user_id
      - source_event_id
      - trip_id
      - type
      - title
      - body
      - read
      - created_at
      additionalProperties: false
    TripPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        next_cursor:
          type: string
      required:
      - items
      additionalProperties: false
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        next_cursor:
          type: string
      required:
      - items
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - not_ready
        service:
          type: string
      required:
      - status
      - service
      additionalProperties: false
