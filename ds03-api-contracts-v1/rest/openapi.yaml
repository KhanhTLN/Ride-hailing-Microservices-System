openapi: 3.1.0
info:
  title: DS03 Ride Hailing REST Contract
  version: 1.0.0
  description: Proposed team baseline. Seven independently deployed services; x-owner-service
    identifies the owner. Gateway routing is optional. See docs/CONTRACT.md for normative
    business rules.
servers:
- url: http://localhost:8080
  description: Local gateway example; configure service routing
security:
- bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      tags:
      - identity
      summary: Register passenger or driver account; DRIVER does not imply approval
      x-owner-service: identity
      x-roles: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema: &id001
          type: string
          format: uuid
        description: Generated by ingress if absent; propagated end to end.
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Same key and canonical payload for retries; persist >= 7 days.
      responses:
        '201':
          description: Success
          headers:
            X-Correlation-ID:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Deadline exceeded; outcome may be unknown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
